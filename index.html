<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Industry</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:90%;
max-width:400px;
background:#1e293b;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 0 30px rgba(0,0,0,.3);
}

.logo{
font-size:60px;
margin-bottom:15px;
}

h1{
margin-bottom:10px;
}

p{
color:#cbd5e1;
margin-bottom:25px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:18px;
background:#229ED9;
color:white;
cursor:pointer;
}

button:hover{
opacity:.9;
}
</style>

</head>

<body>

<div class="card">

<div class="logo">🚀</div>

<h1>Design Industry</h1>

<p>Bienvenue dans la Mini App Telegram.</p>

<button onclick="Telegram.WebApp.showAlert('Mini App connectée avec succès !')">
Ouvrir
</button>

</div>

<script>
Telegram.WebApp.ready();
Telegram.WebApp.expand();
</script>

</body>
</html>
