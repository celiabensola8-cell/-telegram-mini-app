<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Design Industry</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(180deg,#070B17,#0B1736);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:90%;
max-width:360px;
padding:30px;
border-radius:25px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
text-align:center;
}

h1{
font-size:36px;
margin:15px 0;
}

p{
opacity:.8;
margin-bottom:25px;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:15px;
background:#00CFFF;
color:white;
font-size:20px;
cursor:pointer;
}

button:active{
transform:scale(.98);
}
</style>
</head>

<body>

<div class="card">

<div style="font-size:70px">🚀</div>

<h1>Design Industry</h1>

<p>Bienvenue dans votre studio de création graphique.</p>

<button onclick="Telegram.WebApp.showAlert('Bienvenue sur Design Industry 🚀')">
Entrer
</button>

</div>

<script>
Telegram.WebApp.ready();
Telegram.WebApp.expand();
</script>

</body>
</html>
